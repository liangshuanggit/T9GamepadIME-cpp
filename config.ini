# T9 手柄九宫格输入法 —— 配置文件
# 放在程序工作目录（运行目录）下，缺省项使用内置默认值。

# 开关快捷键：需同时按住的按钮组合，用 '+' 连接。
# 可用按钮名：A B X Y LB RB Start Back DpadUp DpadDown DpadLeft DpadRight
toggle_hotkey = Start

# 右摇杆拨动的幅度阈值（0~1）：超过 stick_activate 触发一次，
# 需回落到 stick_release 以下才能再次触发。
# activate 较高(0.8)需刻意推动，release 较低(0.15)需完全回中，
# 配合方向锁定防止回中路径经过相邻方向时误触。
stick_activate = 0.8
stick_release = 0.15

# 候选词每页数量
candidate_page = 5

# 启动时是否已开启输入法功能（true/false）
start_enabled = false

# 九宫格覆盖层不透明度（0.0~1.0），0.0 为背景完全透明（仅内容可见）
overlay_opacity = 0.0
